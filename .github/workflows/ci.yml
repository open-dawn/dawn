name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main
      - stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"

  XCBEAUTIFY_VERSION: "3.2.1"
  XCBEAUTIFY_SHA256: "ed32972e41bc3aa19588f8b0f4a0209ef70c663ad60bbf4ad84a2de73355d637"

jobs:
  validate:
    name: Validate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned tools
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="$RUNNER_TEMP/dawn-tools"
          mkdir -p \
            "$TOOLS_DIR/swiftlint" \
            "$TOOLS_DIR/xcbeautify"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --algorithm 256 --check

          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$TOOLS_DIR"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"

          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" \
            | shasum --algorithm 256 --check

          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$TOOLS_DIR/swiftlint"
          chmod +x "$TOOLS_DIR/swiftlint/swiftlint"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/xcbeautify.zip" \
            "https://github.com/cpisciotta/xcbeautify/releases/download/${XCBEAUTIFY_VERSION}/xcbeautify-${XCBEAUTIFY_VERSION}-arm64-apple-macosx.zip"

          echo "${XCBEAUTIFY_SHA256}  $RUNNER_TEMP/xcbeautify.zip" \
            | shasum --algorithm 256 --check

          unzip -q \
            "$RUNNER_TEMP/xcbeautify.zip" \
            -d "$TOOLS_DIR/xcbeautify"

          chmod +x "$TOOLS_DIR/xcbeautify/xcbeautify"

          echo "$TOOLS_DIR/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$TOOLS_DIR/swiftlint" >> "$GITHUB_PATH"
          echo "$TOOLS_DIR/xcbeautify" >> "$GITHUB_PATH"

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          xcodebuild -version
          swift --version
          xcodegen --version
          swiftlint version
          xcbeautify --version

      - name: Run SwiftLint
        shell: bash
        run: swiftlint lint --strict

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Inspect generated project
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project dawn.xcodeproj \
            -scheme dawn \
            -list

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project dawn.xcodeproj \
            -scheme dawn \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            test 2>&1 |
            xcbeautify --renderer github-actions

      - name: Build Release configuration
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/stable' ||
          github.base_ref == 'stable'
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project dawn.xcodeproj \
            -scheme dawn \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 |
            xcbeautify --renderer github-actions
