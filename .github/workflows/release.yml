name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag used for artifact naming, for example v0.1.0-alpha.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

  XCBEAUTIFY_VERSION: "3.2.1"
  XCBEAUTIFY_SHA256: "ed32972e41bc3aa19588f8b0f4a0209ef70c663ad60bbf4ad84a2de73355d637"

jobs:
  release:
    name: Build release
    runs-on: macos-26
    timeout-minutes: 60
    environment: release

    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "error: APPLE_TEAM_ID must be a 10-character Apple team identifier" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "error: checkout is not clean" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/stable" ]]; then
              echo "error: manual release runs must use the stable branch" >&2
              exit 1
            fi

            RELEASE_TAG="$MANUAL_RELEASE_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "error: invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/stable; then
            echo "error: origin/stable was not found" >&2
            exit 1
          fi

          STABLE_SHA="$(git rev-parse refs/remotes/origin/stable)"

          if [[ "$GITHUB_SHA" != "$STABLE_SHA" ]]; then
            echo "error: release commit must be the head of stable" >&2
            echo "release: $GITHUB_SHA" >&2
            echo "stable:  $STABLE_SHA" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          MARKETING_VERSION="${BASH_REMATCH[1]}"

          ARTIFACT_DIRECTORY="$RUNNER_TEMP/release-artifacts"
          ARCHIVE_PATH="$RUNNER_TEMP/DAWN-${RELEASE_VERSION}.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          APP_PATH="$EXPORT_PATH/DAWN.app"
          DMG_PATH="$ARTIFACT_DIRECTORY/DAWN-${RELEASE_VERSION}.dmg"
          CHECKSUM_PATH="$DMG_PATH.sha256"
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDApplication.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/dawn-release.keychain-db"

          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          SPARKLE_GENERATE_APPCAST_PATH="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"

          APPCAST_PATH="$ARTIFACT_DIRECTORY/appcast.xml"
          RELEASE_NOTES_MARKDOWN_PATH="$RUNNER_TEMP/DAWN-${RELEASE_VERSION}.md"
          RELEASE_NOTES_PATH="$ARTIFACT_DIRECTORY/DAWN-${RELEASE_VERSION}.html"

          DOWNLOAD_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          RELEASE_NOTES_URL_PREFIX="https://update.opendawn.app/releases/"

          mkdir -p "$ARTIFACT_DIRECTORY"

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "EXPECTED_MARKETING_VERSION=$MARKETING_VERSION"
            echo "ARTIFACT_DIRECTORY=$ARTIFACT_DIRECTORY"
            echo "ARCHIVE_PATH=$ARCHIVE_PATH"
            echo "EXPORT_PATH=$EXPORT_PATH"
            echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH"
            echo "APP_PATH=$APP_PATH"
            echo "DMG_PATH=$DMG_PATH"
            echo "CHECKSUM_PATH=$CHECKSUM_PATH"
            echo "CERTIFICATE_PATH=$CERTIFICATE_PATH"
            echo "API_KEY_PATH=$API_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH"
            echo "SPARKLE_GENERATE_APPCAST_PATH=$SPARKLE_GENERATE_APPCAST_PATH"
            echo "APPCAST_PATH=$APPCAST_PATH"
            echo "RELEASE_NOTES_MARKDOWN_PATH=$RELEASE_NOTES_MARKDOWN_PATH"
            echo "RELEASE_NOTES_PATH=$RELEASE_NOTES_PATH"
            echo "DOWNLOAD_URL_PREFIX=$DOWNLOAD_URL_PREFIX"
            echo "RELEASE_NOTES_URL_PREFIX=$RELEASE_NOTES_URL_PREFIX"
          } >> "$GITHUB_ENV"

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIRECTORY="$RUNNER_TEMP/dawn-release-tools"

          mkdir -p \
            "$TOOLS_DIRECTORY" \
            "$TOOLS_DIRECTORY/xcbeautify"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" |
            shasum --algorithm 256 --check

          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$TOOLS_DIRECTORY"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$RUNNER_TEMP/xcbeautify.zip" \
            "https://github.com/cpisciotta/xcbeautify/releases/download/${XCBEAUTIFY_VERSION}/xcbeautify-${XCBEAUTIFY_VERSION}-arm64-apple-macosx.zip"

          echo "${XCBEAUTIFY_SHA256}  $RUNNER_TEMP/xcbeautify.zip" |
            shasum --algorithm 256 --check

          unzip -q \
            "$RUNNER_TEMP/xcbeautify.zip" \
            -d "$TOOLS_DIRECTORY/xcbeautify"

          chmod +x "$TOOLS_DIRECTORY/xcbeautify/xcbeautify"

          echo "$TOOLS_DIRECTORY/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$TOOLS_DIRECTORY/xcbeautify" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Import release credentials
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$CERTIFICATE_P12_BASE64" |
            base64 --decode > "$CERTIFICATE_PATH"

          printf '%s' "$API_KEY_P8_BASE64" |
            base64 --decode > "$API_KEY_PATH"

          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          IDENTITY_OUTPUT="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH"
          )"

          printf '%s\n' "$IDENTITY_OUTPUT"

          IDENTITY_COUNT="$(
            printf '%s\n' "$IDENTITY_OUTPUT" |
              grep -c '"Developer ID Application:' || true
          )"

          if [[ "$IDENTITY_COUNT" -ne 1 ]]; then
            echo "error: expected exactly one Developer ID Application identity" >&2
            exit 1
          fi

          SIGNING_IDENTITY="$(
            printf '%s\n' "$IDENTITY_OUTPUT" |
              awk '/"Developer ID Application:/{print $2; exit}'
          )"

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Archive signed application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project dawn.xcodeproj \
            -scheme dawn \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            archive 2>&1 |
            xcbeautify --renderer github-actions

      - name: Export Developer ID application
        shell: bash
        run: |
          set -euo pipefail

          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>developer-id</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

      - name: Validate Sparkle release tool
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -x "$SPARKLE_GENERATE_APPCAST_PATH" ]]; then
            echo "error: generate_appcast was not found: $SPARKLE_GENERATE_APPCAST_PATH" >&2
            exit 1
          fi

      - name: Validate archived application
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$APP_PATH" ]]; then
            echo "error: archived application not found: $APP_PATH" >&2
            exit 1
          fi

          TOP_LEVEL_APP_COUNT="$(
            find "$EXPORT_PATH" \
              -maxdepth 1 \
              -name "*.app" \
              -print |
              wc -l |
              tr -d ' '
          )"

          if [[ "$TOP_LEVEL_APP_COUNT" -ne 1 ]]; then
            echo "error: expected exactly one top-level application" >&2
            exit 1
          fi

          ACTUAL_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Contents/Info.plist"
          )"

          ACTUAL_BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Contents/Info.plist"
          )"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_MARKETING_VERSION" ]]; then
            echo "error: expected version $EXPECTED_MARKETING_VERSION, got $ACTUAL_VERSION" >&2
            exit 1
          fi

          if [[ ! "$ACTUAL_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: invalid build number: $ACTUAL_BUILD" >&2
            exit 1
          fi

          echo "RELEASE_BUILD_VERSION=$ACTUAL_BUILD" >> "$GITHUB_ENV"

          APP_ARCHITECTURES="$(
            lipo -archs "$APP_PATH/Contents/MacOS/DAWN"
          )"

          AGENT_PATH="$APP_PATH/Contents/Library/LoginItems/dawnAgent.app"
          AGENT_ARCHITECTURES="$(
            lipo -archs "$AGENT_PATH/Contents/MacOS/dawnAgent"
          )"

          if [[ "$APP_ARCHITECTURES" != "arm64" ]]; then
            echo "error: unexpected DAWN architectures: $APP_ARCHITECTURES" >&2
            exit 1
          fi

          if [[ "$AGENT_ARCHITECTURES" != "arm64" ]]; then
            echo "error: unexpected agent architectures: $AGENT_ARCHITECTURES" >&2
            exit 1
          fi

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          SPARKLE_PATH="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"

          for SIGNED_ITEM in \
            "$APP_PATH" \
            "$AGENT_PATH" \
            "$APP_PATH/Contents/Frameworks/Sparkle.framework" \
            "$SPARKLE_PATH/Updater.app" \
            "$SPARKLE_PATH/Autoupdate" \
            "$SPARKLE_PATH/XPCServices/Downloader.xpc" \
            "$SPARKLE_PATH/XPCServices/Installer.xpc"; do

            SIGNING_INFORMATION="$(
              codesign \
                --display \
                --verbose=4 \
                "$SIGNED_ITEM" 2>&1
            )"

            printf '%s\n' "$SIGNING_INFORMATION"

            printf '%s\n' "$SIGNING_INFORMATION" |
              grep -F "Authority=Developer ID Application:"

            printf '%s\n' "$SIGNING_INFORMATION" |
              grep -F "TeamIdentifier=$APPLE_TEAM_ID"

            printf '%s\n' "$SIGNING_INFORMATION" |
              grep -E "flags=.*runtime"

            printf '%s\n' "$SIGNING_INFORMATION" |
              grep -F "Timestamp="
          done

      - name: Create and sign disk image
        shell: bash
        run: |
          set -euo pipefail

          Scripts/create_dmg.sh \
            "$APP_PATH" \
            "$DMG_PATH" \
            "DAWN $RELEASE_VERSION"

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "$DMG_PATH"

          hdiutil verify "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Submit disk image for notarization
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          NOTARY_RESULT="$RUNNER_TEMP/notary-result.json"
          NOTARY_LOG="$RUNNER_TEMP/notary-log.json"

          if ! xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json \
            > "$NOTARY_RESULT"; then

            cat "$NOTARY_RESULT" || true

            SUBMISSION_ID="$(
              python3 -c \
                'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' \
                "$NOTARY_RESULT" 2>/dev/null || true
            )"

            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$API_KEY_PATH" \
                --key-id "$API_KEY_ID" \
                --issuer "$API_ISSUER_ID" \
                "$NOTARY_LOG" || true

              cat "$NOTARY_LOG" || true
            fi

            exit 1
          fi

          cat "$NOTARY_RESULT"

          NOTARY_STATUS="$(
            python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1]))["status"])' \
              "$NOTARY_RESULT"
          )"

          SUBMISSION_ID="$(
            python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1]))["id"])' \
              "$NOTARY_RESULT"
          )"

          if [[ "$NOTARY_STATUS" != "Accepted" ]]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" \
              "$NOTARY_LOG" || true

            cat "$NOTARY_LOG" || true

            echo "error: notarization status was $NOTARY_STATUS" >&2
            exit 1
          fi

      - name: Staple and validate notarization
        shell: bash
        run: |
          set -euo pipefail

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          hdiutil verify "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          spctl \
            --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$ARTIFACT_DIRECTORY"

            shasum \
              --algorithm 256 \
              "$(basename "$DMG_PATH")" \
              > "$(basename "$CHECKSUM_PATH")"
          )

          cat "$CHECKSUM_PATH"

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          GENERATED_NOTES_JSON="$RUNNER_TEMP/generated-release-notes.json"
          MARKDOWN_REQUEST_JSON="$RUNNER_TEMP/render-markdown.json"
          RENDERED_NOTES_FRAGMENT="$RUNNER_TEMP/release-notes-fragment.html"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            > "$GENERATED_NOTES_JSON"

          jq -er \
            '.body | select(type == "string" and length > 0)' \
            "$GENERATED_NOTES_JSON" \
            > "$RELEASE_NOTES_MARKDOWN_PATH"

          jq -n \
            --rawfile text "$RELEASE_NOTES_MARKDOWN_PATH" \
            --arg context "$GITHUB_REPOSITORY" \
            '{
              text: $text,
              mode: "gfm",
              context: $context
            }' \
            > "$MARKDOWN_REQUEST_JSON"

          gh api \
            --method POST \
            -H "Accept: text/html" \
            markdown \
            --input "$MARKDOWN_REQUEST_JSON" \
            > "$RENDERED_NOTES_FRAGMENT"

          {
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
              "  <title>DAWN $RELEASE_VERSION</title>" \
              '</head>' \
              '<body>' \
              '<main>'

            cat "$RENDERED_NOTES_FRAGMENT"

            printf '%s\n' \
              '</main>' \
              '</body>' \
              '</html>'
          } > "$RELEASE_NOTES_PATH"

      - name: Prepare existing appcast
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_APPCAST_URL="https://update.opendawn.app/appcast.xml"

          if ! HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$APPCAST_PATH" \
              --write-out "%{http_code}" \
              "$CURRENT_APPCAST_URL"
          )"; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::warning::The production appcast could not be downloaded; continuing the dry run without feed history"
              rm -f "$APPCAST_PATH"
              exit 0
            fi

            echo "error: failed to download the current appcast" >&2
            exit 1
          fi

          case "$HTTP_STATUS" in
            200)
              /usr/bin/xmllint --noout "$APPCAST_PATH"

              PREVIOUS_BUILD="$(
                /usr/bin/xmllint \
                  --xpath "string((//*[local-name()='item'])[1]/*[local-name()='version'])" \
                  "$APPCAST_PATH"
              )"

              if [[ ! "$PREVIOUS_BUILD" =~ ^[1-9][0-9]*$ ]]; then
                echo "error: invalid build number in current appcast: $PREVIOUS_BUILD" >&2
                exit 1
              fi

              if (( 10#$RELEASE_BUILD_VERSION <= 10#$PREVIOUS_BUILD )); then
                echo "error: build $RELEASE_BUILD_VERSION must be greater than published build $PREVIOUS_BUILD" >&2
                exit 1
              fi
              ;;

            404)
              echo "No existing appcast was found; creating the initial feed"
              rm -f "$APPCAST_PATH"
              ;;

            *)
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                echo "::warning::The production appcast returned HTTP $HTTP_STATUS; continuing the dry run without feed history"
                rm -f "$APPCAST_PATH"
              else
                echo "error: appcast request returned HTTP $HTTP_STATUS" >&2
                exit 1
              fi
              ;;
          esac

      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" |
            Scripts/generate_appcast.sh \
              "$SPARKLE_GENERATE_APPCAST_PATH" \
              "$ARTIFACT_DIRECTORY" \
              "$APPCAST_PATH" \
              "$DOWNLOAD_URL_PREFIX" \
              "$RELEASE_NOTES_URL_PREFIX" \
              "$RELEASE_BUILD_VERSION" \
              "$EXPECTED_MARKETING_VERSION"

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-artifacts/*.dmg
            ${{ runner.temp }}/release-artifacts/*.sha256
            ${{ runner.temp }}/release-artifacts/*.html
            ${{ runner.temp }}/release-artifacts/*.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Create draft GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_FLAGS=(
            --verify-tag
            --draft
            --notes-file "$RELEASE_NOTES_MARKDOWN_PATH"
            --title "DAWN $RELEASE_VERSION"
          )

          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS+=(
              --prerelease
              --latest=false
            )
          fi

          gh release create \
            "$RELEASE_TAG" \
            "$DMG_PATH" \
            "$CHECKSUM_PATH" \
            "$APPCAST_PATH" \
            "$RELEASE_NOTES_PATH" \
            "${RELEASE_FLAGS[@]}"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          if [[ -n "${CERTIFICATE_PATH:-}" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi

          if [[ -n "${API_KEY_PATH:-}" ]]; then
            rm -f "$API_KEY_PATH"
          fi
