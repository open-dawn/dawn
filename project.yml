name: pineapplewm
options:
  bundleIdPrefix: dev.longhi.pineappleinc

settings:
  base:
    SWIFT_VERSION: "6"

targets:

  PaSettingsUI:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PaSettingsUI
    info:
      path: PaSettingsUI/Info.plist
      properties:
        CFBundleDisplayName: "PineappleWM Settings"
    settings:
      base:
        MARKETING_VERSION: "0.0.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: PaEventKit
      - target: PaWM
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    scheme:
      testTargets:
        - PaSettingsUITests
      gatherCoverageData: true

  PaWM:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PaWM
    info:
      path: PaWM/Info.plist
      properties:
        CFBundleDisplayName: "PineappleWM Launch Agent"
        LSUIElement: true
    settings:
      base:
        MARKETING_VERSION: "0.0.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: PaEventKit
    scheme:
      testTargets:
        - PaWMTests
      gatherCoverageData: true
  
  PaEventKit:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PaEventKit
        excludes:
          - README.md
          - Docs/**
    info:
      path: PaEventKit/Info.plist
      properties:
        CFBundleDisplayName: "PineappleWM PaEventKit Framework"
    settings:
      base:
        MARKETING_VERSION: "0.0.0"
        SWIFT_VERSION: "6"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - PaEventKitTests
      gatherCoverageData: true

  PaEventKitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PaEventKitTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6"
    dependencies:
      - target: PaEventKit

  PaWMTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PaWMTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6"
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/PaWM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PaWM
      BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PaWM

  PaSettingsUITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PaSettingsUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6"
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/PaSettingsUI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PaSettingsUI
      BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PaSettingsUI

schemes:
  pineapplewm:
    build:
      targets:
        PaEventKit: all
        PaWM: all
        PaSettingsUI: all
        PaEventKitTests: [test]
        PaWMTests: [test]
        PaSettingsUITests: [test]
    test:
      targets:
        - PaEventKitTests
        - PaWMTests
        - PaSettingsUITests
